name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, ads-test]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يولّد مجلد android تلقائياً (ما يمس ملفات lib)
      - name: Create Android platform
        run: |
          flutter create . --platforms=android --org iq.almawlida --project-name sahib_almawlida
          rm -rf test
          sed -i 's/android:label="sahib_almawlida"/android:label="صاحب المولدة"/' android/app/src/main/AndroidManifest.xml
          # رقم تطبيق AdMob (هسه رقم التجربة الرسمي، بدّله برقمك)
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' android/app/src/main/AndroidManifest.xml
          # نتأكد إن رقم AdMob انضاف (بدونه التطبيق يطب أول ما ينفتح)
          echo "----- AndroidManifest -----"
          cat android/app/src/main/AndroidManifest.xml
          grep -q "gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml || (echo "AdMob APPLICATION_ID missing!" && exit 1)
          echo "----- app build.gradle -----"
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      # نطفي فحص Lint بالـ release (يطيح ويا مكتبة الإعلانات وما يأثر على اللعبة)
      - name: Disable release lint
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
            grep -n -A4 "^android {" android/app/build.gradle.kts
          else
            sed -i '0,/^android {/s//android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle
            grep -n -A4 "^android {" android/app/build.gradle
          fi

      # (فرع التجربة) يمسك سبب الطب ويعرضه بنافذة بالمرة الجاية
      - name: Crash catcher
        run: |
          MA=$(find android/app/src/main/kotlin -name MainActivity.kt | head -1)
          DIR=$(dirname "$MA")
          PKG=$(grep -m1 '^package' "$MA" | sed 's/package //')
          echo "MainActivity: $MA  package: $PKG"
          cat > "$DIR/CrashApp.kt" <<KT
          package $PKG

          import android.app.Application
          import android.content.ComponentName
          import android.content.Context
          import android.content.pm.PackageManager
          import java.io.File

          class CrashApp : Application() {
              override fun attachBaseContext(base: Context) {
                  super.attachBaseContext(base)
                  val prev = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { t, e ->
                      try {
                          File(base.filesDir, "crash.txt").writeText(android.util.Log.getStackTraceString(e))
                          base.packageManager.setComponentEnabledSetting(
                              ComponentName(base.packageName, "com.google.android.gms.ads.MobileAdsInitProvider"),
                              PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP)
                      } catch (x: Throwable) {}
                      prev?.uncaughtException(t, e)
                  }
              }
          }
          KT
          cat > "$MA" <<KT
          package $PKG

          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import java.io.File

          class MainActivity : FlutterActivity() {
              private var crashText: String? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  val f = File(filesDir, "crash.txt")
                  if (f.exists()) {
                      crashText = f.readText()
                      f.delete()
                  }
                  super.onCreate(savedInstanceState)
                  val t = crashText ?: return
                  AlertDialog.Builder(this)
                      .setTitle("سبب الطب")
                      .setMessage(t.take(4000))
                      .setPositiveButton("نسخ") { _, _ ->
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("crash", t))
                      }
                      .show()
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  // إذا طبت قبل، نشغل بدون الإضافات حتى نگدر نعرض الخطأ
                  if (crashText == null) super.configureFlutterEngine(flutterEngine)
              }
          }
          KT
          sed -i 's#android:name="\${applicationName}"#android:name=".CrashApp"#' android/app/src/main/AndroidManifest.xml
          grep -n "CrashApp" android/app/src/main/AndroidManifest.xml
          cat "$MA"

      # أيقونة التطبيق (إذا موجودة بالمشروع)
      - name: App icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -f icon-$d.png ]; then cp icon-$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png; fi
          done

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: sahib-almawlida-apk-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*-release.apk
