name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          flutter create . --platforms=android --org iq.almawlida --project-name sahib_almawlida
          rm -rf test
          sed -i 's/android:label="sahib_almawlida"/android:label="صاحب المولدة"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: sahib-almawlida-apk
          path: build/app/outputs/flutter-apk/*-release.apk
